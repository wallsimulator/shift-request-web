<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>勤務希望入力</title>
<meta name="theme-color" content="#173d36"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="勤務希望"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--brand:#176b5b;--brand2:#e7f3ef;--ink:#18312d;--muted:#657873;--line:#d6e2de;--bg:#f3f6f4}*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Noto Sans JP",system-ui,sans-serif}.top{background:#173d36;color:#fff;padding:18px}.top h1{max-width:1000px;margin:auto;font-size:22px}.wrap{width:100%;max-width:1000px;margin:auto;padding:18px}.panel{width:100%;min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.sectiontitle{font-size:17px;margin:0 0 12px}.intro{color:var(--muted);line-height:1.7;margin-top:0}.basic{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:14px}.field{display:flex;min-width:0;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:800}.field input,.day select,.day input{width:100%;min-width:0;max-width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}.calendar{width:100%;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.day{min-width:0;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.day.weekend{background:#fff8f8}.date{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:800}.date span{font-size:12px;color:var(--muted)}.day input{margin-top:7px;font-size:12px}.actions{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;background:#ffffffed;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 -3px 18px #0001}.btn{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px 16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.count{margin-right:auto;align-self:center;color:var(--muted);font-size:13px}.saved{display:block;color:var(--brand);font-weight:700;margin-top:2px}.note{font-size:12px;color:var(--muted);line-height:1.6}@media(max-width:760px){.basic{grid-template-columns:minmax(0,1fr)}.calendar{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:10px}.actions{justify-content:stretch;flex-wrap:wrap}.actions .btn{flex:1;min-width:30%}.count{width:100%;margin:0;display:block}.saved{display:inline;margin-left:8px}}@media(max-width:600px){.top{padding:12px}.top h1{font-size:18px}.wrap{padding:8px}.panel{padding:12px;border-radius:10px;margin-bottom:10px}.intro{font-size:13px;line-height:1.55}.calendar{display:block}.day{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:8px;padding:8px}.date{grid-row:1/3;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;margin:0;line-height:1.25}.day input{margin:0}.note{margin-bottom:0}.actions{position:static;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}.count{grid-column:1/-1}.actions .btn{width:100%;min-width:0;padding:10px 6px;font-size:13px}.actions .btn.primary{grid-column:1/-1}.saved{display:block;margin:2px 0 0}.sectiontitle{font-size:16px}}
</style></head><body>
<header class="top"><h1>勤務希望入力（職員用）</h1></header>
<main class="wrap">
<section class="panel"><p class="intro">氏名と対象月を入力し、希望がある日だけ勤務内容を選んでください。入力内容はこのスマホのブラウザー内へ自動保存されます。後日開いたときは「前回の続きから」を押してください。</p><div class="basic"><div class="field"><label for="employeeName">氏名（勤務表と同じ表記）</label><input id="employeeName" autocomplete="name" placeholder="例：山田 太郎"></div><div class="field"><label for="month">対象月</label><input id="month" type="month"></div></div></section>
<section class="panel"><h2 class="sectiontitle">勤務希望を入力</h2><div id="calendar" class="calendar"></div><p class="note">「希望なし」は提出対象になりません。「日勤希望」は空白の日勤として固定されます。夜勤希望は管理者側で職員の性別に合わせてAまたはBになります。</p></section>
<div class="actions"><span id="count" class="count">希望 0件 <small id="savedStatus" class="saved"></small></span><button class="btn" id="restoreBtn" disabled>前回の続きから</button><button class="btn" id="clearBtn">入力を消去</button><button class="btn primary" id="saveBtn">提出ファイルを保存</button></div>
</main>
<script>
const $=s=>document.querySelector(s),calendar=$('#calendar'),month=$('#month'),nameInput=$('#employeeName'),count=$('#count'),restoreBtn=$('#restoreBtn'),savedStatus=$('#savedStatus'),DRAFT_KEY='shift_request_mobile_draft_v1';
month.value=new Date().toISOString().slice(0,7);
const choices=[['','希望なし'],['公休','公休'],['有給','有給'],['日勤','日勤希望'],['夜勤','夜勤希望'],['夜勤明け','夜勤明け'],['半休前半','半休（前半）'],['半休後半','半休（後半）'],['研修','研修'],['出張','出張']];
function days(){return new Date(+month.value.slice(0,4),+month.value.slice(5,7),0).getDate()}
function updateCount(){const number=[...document.querySelectorAll('[data-symbol]')].filter(x=>x.value).length;count.firstChild.textContent=`希望 ${number}件 `}
function render(){const old={};document.querySelectorAll('.day').forEach(x=>old[x.dataset.day]={symbol:x.querySelector('[data-symbol]').value,note:x.querySelector('[data-note]').value});calendar.innerHTML='';for(let d=1;d<=days();d++){const dow=new Date(+month.value.slice(0,4),+month.value.slice(5,7)-1,d).getDay(),card=document.createElement('div');card.className='day '+(dow===0||dow===6?'weekend':'');card.dataset.day=d;card.innerHTML=`<div class="date">${d}日 <span>${'日月火水木金土'[dow]}曜日</span></div><select data-symbol aria-label="${d}日の勤務希望">${choices.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select><input data-note aria-label="${d}日の備考" placeholder="備考（任意）">`;calendar.appendChild(card);if(old[d]){card.querySelector('[data-symbol]').value=old[d].symbol;card.querySelector('[data-note]').value=old[d].note}}updateCount()}
function draftData(){return{version:'shift-request-draft-v1',employeeName:nameInput.value.trim(),month:month.value,savedAt:new Date().toISOString(),requests:[...document.querySelectorAll('.day')].map(card=>({day:+card.dataset.day,symbol:card.querySelector('[data-symbol]').value,note:card.querySelector('[data-note]').value.trim()})).filter(x=>x.symbol||x.note)}}
function readDraft(){try{return JSON.parse(localStorage.getItem(DRAFT_KEY)||'null')}catch(e){return null}}
let saveTimer;function autoSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{const draft=draftData();localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));restoreBtn.disabled=false;savedStatus.textContent=`自動保存済み ${new Date(draft.savedAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`}catch(e){savedStatus.textContent='自動保存を利用できません'}},250)}
function restoreDraft(){const draft=readDraft();if(!draft)return alert('前回の入力はありません。');nameInput.value=draft.employeeName||'';month.value=draft.month||month.value;calendar.innerHTML='';render();for(const req of draft.requests||[]){const card=document.querySelector(`.day[data-day="${+req.day}"]`);if(!card)continue;card.querySelector('[data-symbol]').value=req.symbol||'';card.querySelector('[data-note]').value=req.note||''}updateCount();savedStatus.textContent='前回の入力を復元しました';window.scrollTo({top:0,behavior:'smooth'})}
calendar.addEventListener('input',()=>{updateCount();autoSave()});nameInput.addEventListener('input',autoSave);month.addEventListener('change',()=>{render();autoSave()});restoreBtn.onclick=restoreDraft;
$('#clearBtn').onclick=()=>{if(!confirm('入力した勤務希望と、この端末の自動保存データをすべて消去しますか？'))return;clearTimeout(saveTimer);nameInput.value='';document.querySelectorAll('[data-symbol]').forEach(x=>x.value='');document.querySelectorAll('[data-note]').forEach(x=>x.value='');try{localStorage.removeItem(DRAFT_KEY)}catch(e){}restoreBtn.disabled=true;savedStatus.textContent='';updateCount()};
$('#saveBtn').onclick=()=>{const employeeName=nameInput.value.trim();if(!employeeName)return alert('氏名を入力してください。');const requests=[...document.querySelectorAll('.day')].map(card=>({day:+card.dataset.day,symbol:card.querySelector('[data-symbol]').value,note:card.querySelector('[data-note]').value.trim()})).filter(x=>x.symbol);if(!requests.length)return alert('勤務希望を1件以上選んでください。');const data={version:'shift-request-v1',employeeName,month:month.value,submittedAt:new Date().toISOString(),requests},blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${month.value}_${employeeName.replace(/[\\/:*?"<>|]/g,'_')}_勤務希望.shift-request`;a.click();URL.revokeObjectURL(a.href);alert('提出ファイルを保存しました。\nこのファイルを管理者へ送ってください。')};
render();const existingDraft=readDraft();restoreBtn.disabled=!existingDraft;if(existingDraft?.savedAt)savedStatus.textContent=`前回保存 ${new Date(existingDraft.savedAt).toLocaleString('ja-JP')}`;if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
